name: Restaurant Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the restaurant and stage the static site
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { Script } from 'node:vm';
          const html = readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (scripts.length === 0 || !html.includes('</html>')) {
            throw new Error('The restaurant entry point is incomplete.');
          }
          for (const [, source] of scripts) new Script(source, { filename: 'index.html' });
          JS
          mkdir -p dist
          node --check table/scene.mjs
          cp -R index.html assets table dist/
          test -s dist/assets/dining-models.glb
          test -s dist/assets/table-furniture.glb
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: restaurant-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4

  verify-table:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the published table in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/table-check" playwright@1.51.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/table-check/node_modules/playwright" node tools/check-table.cjs "https://iliabuhov92.github.io/meridiam-restaurant/table/?build=$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-browser-captures
          path: table-captures/
          if-no-files-found: ignore
